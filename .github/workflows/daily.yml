name: KHunter 每日选股
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: khunter-daily
  cancel-in-progress: false
jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt exchange-calendars==4.13.2
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: khunter-db-v1-${{ github.run_id }}
          restore-keys: khunter-db-v1-
      - name: Configure selection and Feishu
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          webhook = os.environ.get('FEISHU_WEBHOOK', '')
          if not webhook:
              raise SystemExit('Missing FEISHU_WEBHOOK repository secret')
          path = Path('config/config.yaml')
          config = yaml.safe_load(path.read_text(encoding='utf-8-sig'))
          config['feishu'] = {'webhook_url': webhook, 'alert_only': False}
          config['run_mode'] = {'mode': 'manual'}
          config['ptrade']['enabled'] = False
          config['pipeline_schedule']['detect_trading_day'] = False
          path.write_text(yaml.safe_dump(config, allow_unicode=True), encoding='utf-8')
          PY
      - name: Fetch market history and repair missing stocks
        id: history
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from datetime import date, timedelta
          import akshare as ak
          from main import QuantSystem
          quant = QuantSystem()
          names = quant.fetcher.get_all_stock_codes()
          if not names:
              raise SystemExit('Market stock list is empty')
          if not quant.db_manager.list_all_stocks():
              quant.init_data(max_stocks=None, years=1)
          existing = set(quant.db_manager.list_all_stocks())
          missing = sorted(set(names) - existing)
          print(f'Market universe: {len(names)}; missing daily history: {len(missing)}')
          recovered = []
          for code in missing:
              df = quant.fetcher.stock_data_fetcher._fetch_stock_history_http(code, years=1)
              source = 'Tencent'
              if df is None or df.empty:
                  source = 'Sina'
                  symbol = ('sh' if code.startswith('6') else 'sz') + code
                  try:
                      df = ak.stock_zh_a_daily(symbol=symbol,
                          start_date=(date.today()-timedelta(days=365)).strftime('%Y%m%d'),
                          end_date=date.today().strftime('%Y%m%d'), adjust='qfq')
                  except Exception as exc:
                      print(f'{code}: Sina unavailable: {type(exc).__name__}')
                      df = None
              if df is not None and not df.empty:
                  if quant.db_manager.write_stock(code, df):
                      recovered.append(code)
                      print(f'{code}: recovered {len(df)} bars from {source}')
              time.sleep(0.3)
          available = set(quant.db_manager.list_all_stocks())
          remaining = sorted(set(names) - available)
          report = {'universe_count': len(names),
                    'with_daily_history': len(set(names) & available),
                    'recovered_count': len(recovered), 'missing_codes': remaining}
          Path('logs').mkdir(exist_ok=True)
          Path('logs/data_coverage.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print(json.dumps(report, ensure_ascii=False))
          if not available:
              raise SystemExit('No real daily history downloaded')
          if len(remaining) > max(10, len(names) * 0.05):
              raise SystemExit('More than 5% of market universe is missing daily history; cache retained for retry')
          PY
      - name: Run daily pipeline and push
        run: |
          python - <<'PYCODE'
          import os
          import sys
          from datetime import date
          import exchange_calendars as xc
          from scheduler.scheduled_runner import ScheduledRunner
          if not xc.get_calendar('XSHG').is_session(date.today().isoformat()):
              print('Non-trading day: selection skipped')
              sys.stdout.flush()
              os._exit(0)
          result = ScheduledRunner().run_once()
          sys.stdout.flush()
          sys.stderr.flush()
          os._exit(0 if result.status in ('success', 'skipped') else 1)
          PYCODE
      - uses: actions/cache/save@v4
        if: always() && !cancelled()
        with:
          path: data
          key: khunter-db-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: khunter-results-${{ github.run_id }}
          path: |
            logs/
            data/running/
          retention-days: 14
